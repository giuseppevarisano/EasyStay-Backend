spring.application.name=EasyStay
spring.datasource.url=jdbc:h2:mem:easystaydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Utile per il debug: vedi le query SQL nella console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.h2.console.enabled=true
logging.level.org.springframework.beans.factory=DEBUG

# Pattern: data [thread] livello [TRACE] [SESSION] - messaggio
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %highlight(%-5level) %magenta([T:%X{traceId}]) %cyan([S:%X{sessionId}]) - %msg%n

# Crea il database da zero a ogni avvio
spring.jpa.hibernate.ddl-auto=create-drop

#Prima crea le tabelle con Hibernate, e SOLO DOPO esegui data.sql
spring.jpa.defer-datasource-initialization=true